  /vbs/api/v2/upload:
    post:
      tags:
        - Viber Business Messaging API
      summary: Campaign File Upload
      description: >-
        The Campaign File Upload API allows businesses to securely upload their
        contact list or campaign content files to Viber's platform for use in
        bulk campaigns.


        Files must be uploaded as binary data using `multipart/form-data`.
        The following file formats are supported:

        - **CSV** (`.csv`) — Comma-separated contact list

        - **Excel** (`.xlsx`, `.xls`) — Spreadsheet contact list

        - **Plain Text** (`.txt`) — Tab or newline-delimited contact list

        - **ZIP** (`.zip`) — Archive containing a single CSV file


        Once uploaded, the API returns a `campaign_id` which is required when
        sending campaign messages via the Send Campaign Messages API.
      operationId: campaignFileUpload
      x-readme:
        samples-languages:
          - curl
          - python
          - node
          - java
          - php
      requestBody:
        required: true
        description: >
          Upload a campaign contact list or content file as a binary multipart/form-data
          request. Supported formats: CSV, XLSX, XLS, TXT, and ZIP (containing CSV).
          For sample file formats, see:

          - [Bulk Upload File](https://github.com/routemobile/Viber-Business-Messages-API/blob/master/Sample%20Bulk%20Upload%20File.txt)

          - [Bulk Upload Campaign File](https://github.com/routemobile/Viber-Business-Messages-API/blob/master/Sample%20Bulk%20Campaign%20File.csv)
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - File
                - File_mimetype
              properties:
                File:
                  type: string
                  format: binary
                  description: >-
                    The binary file to upload. Supported formats: CSV (.csv),
                    Excel (.xlsx, .xls), plain text (.txt), or a ZIP archive
                    (.zip) containing a CSV file.
                File_mimetype:
                  type: string
                  description: >-
                    The MIME type of the uploaded file. Must match the actual
                    file format being sent.
                  enum:
                    - text/csv
                    - text/plain
                    - application/vnd.ms-excel
                    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                    - application/zip
                    - application/x-zip-compressed
                  example: text/csv
            encoding:
              File:
                contentType: >-
                  text/csv, text/plain,
                  application/vnd.ms-excel,
                  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
                  application/zip,
                  application/x-zip-compressed
            examples:
              CSV Upload:
                value:
                  File: <binary CSV file content>
                  File_mimetype: text/csv
              Excel Upload:
                value:
                  File: <binary XLSX file content>
                  File_mimetype: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
              ZIP Upload:
                value:
                  File: <binary ZIP file content>
                  File_mimetype: application/zip
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
                  campaign_id:
                    type: string
                    description: The ID of the campaign.
                  file_type:
                    type: string
                    description: The file type.
                  file_size:
                    type: string
                    description: "The size of the file.\r\n"
                  total_records:
                    type: integer
                    description: Total records in the file.
                  duplicate_records:
                    type: integer
                    description: Duplicate records in the file.
                  valid_records:
                    type: integer
                    description: Valid records in the file.
              examples:
                Example 1:
                  value:
                    message: File uploaded successfully
                    campaign_id: f8bc9ddc-f3e7-11ed-9242-0242acxxxxxx
                    file_type: application/vnd.ms-excel
                    file_size: 5.5KB
                    total_records: 2
                    duplicate_records: 0
                    valid_records: 2
        '401':
          description: Authentication Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The response message.
                  reason:
                    type: string
                    description: The reason for not processing the upload request.
                  status:
                    type: string
                    description: The status of the file upload.
              examples:
                JWT Token Expired:
                  value:
                    message: unable to process campaign request
                    reason: jwt token expired
                    status: failure
        '404':
          description: Page Not Found
          content:
            application/xml:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 'The message response. '
              examples:
                Not Found:
                  value: >-
                    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
                    <title>404 Not Found</title> <h1>Not Found</h1> <p>The
                    requested URL was not found on the server. If you entered
                    the URL manually please check your spelling and try
                    again.</p>
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The error status.
                  message:
                    type: string
                    description: Rate limit exceeded message.
                  retry_after:
                    type: integer
                    description: Number of seconds to wait before retrying.
              examples:
                Rate limit exceeded:
                  value:
                    status: error
                    message: Too many requests. Please retry after the indicated time.
                    retry_after: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the file upload.
                  message:
                    type: string
                    description: The response message.
              examples:
                Server Error:
                  value:
                    status: error
                    message: Unknown error occured while processing request
      security:
        - jwt: []
  /vbs/api/v3/send_bulk:
    post:
      tags:
        - Viber Bulk Messaging API
      summary: Viber Send Bulk Messages API
      description: >-
        The Viber Send Bulk Messages API allows businesses to send campaign
        messages to multiple recipients at once. The recipients are defined by
        a `file_code` returned from the Campaign File Upload API.


        Supported bulk message types include text, image, text+image, text
        button, text button image, file, video, video+text, video+text+action
        button, and text template. Fallback delivery to SMS or WhatsApp is
        supported on any message type by including `fallback_channel` and the
        corresponding `fallback_sms` or `fallback_whatsapp` block inside the
        payload.


        Campaigns can be scheduled by providing `schedule_datetime` (format:
        `YYYY-MM-DD HH:MM:SS`) and `timezone` (e.g. `Asia/Kolkata`).
      operationId: sendBulkMessages
      x-readme:
        samples-languages:
          - curl
          - python
          - node
          - java
          - php
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/vbs_bulk_text_msg'
                - $ref: '#/components/schemas/vbs_bulk_text_button_msg'
                - $ref: '#/components/schemas/vbs_bulk_text_button_image_msg'
                - $ref: '#/components/schemas/vbs_bulk_textimage_msg'
                - $ref: '#/components/schemas/vbs_bulk_image_msg'
                - $ref: '#/components/schemas/vbs_bulk_file_msg'
                - $ref: '#/components/schemas/vbs_bulk_video_msg'
                - $ref: '#/components/schemas/vbs_bulk_video_text_msg'
                - $ref: '#/components/schemas/vbs_bulk_video_text_action_button_msg'
                - $ref: '#/components/schemas/vbs_bulk_text_template_msg'
                - $ref: '#/components/schemas/vbs_bulk_fallback_msg'
            examples:
              Bulk Text:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: text
                    method: transaction
                    text: '{message text}'
              Bulk Text Button:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: media
                    method: promotion
                    text: '{message text}'
                    button_text: '{button text}'
                    button_link: '{button url with https://}'
              Bulk Text Button Image:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: template
                    method: promotion
                    text: '{message text}'
                    button_text: '{button text}'
                    button_link: '{button url with https://}'
                    img: '{image link with https:// with extension}'
              Bulk Text Image:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: text_image
                    method: promotion
                    img: '{image link with https:// with extension}'
                    text: '{body text}'
              Bulk Image:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: image
                    method: promotion
                    img: '{image link with https:// with extension}'
              Bulk File:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: file
                    method: transaction
                    file_url: '{file link with https:// with extension}'
                    file_name: '{file name with extension}'
              Bulk Video:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: video
                    method: promotion
                    video: '{video link with https:// with extension}'
                    thumbnail_url: '{thumbnail image link with https:// with extension}'
              Bulk Video Text:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: text_video
                    method: promotion
                    video: '{video link with https:// with extension}'
                    text: '{body text}'
                    thumbnail_url: '{thumbnail image link with https:// with extension}'
              Bulk Video Text Action Button:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: video_text_action_button
                    method: promotion
                    video: '{video link with https:// with extension}'
                    text: '{body text}'
                    thumbnail_url: '{thumbnail image link with https:// with extension}'
                    button:
                      button_url: '{button url with https://}'
                      button_text: '{button text}'
              Bulk Text Template:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: text_template
                    method: promotion
                    text: '{message text}'
                    tracking_data: '{tracking data}'
              Bulk with Fallback to SMS:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: image
                    method: promotion
                    img: '{image link with https:// with extension}'
                    fallback_channel: sms
                    fallback_sms:
                      fallback_sender: '{sender id}'
                      fallback_username: '{sms username}'
                      fallback_text: '{fallback message text}'
                      template_id: '{sms template id}'
                      tm_id: '{tm id}'
                      pe_id: '{pe id}'
              Bulk with Fallback to WhatsApp:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  payload:
                    message_type: image
                    method: promotion
                    img: '{image link with https:// with extension}'
                    fallback_channel: whatsapp
                    fallback_whatsapp:
                      fallback_sender: '{sender id}'
                      fallback_username: '{whatsapp username}'
                      fallback_text: '{fallback message text}'
                      template_id: '{whatsapp template id}'
                      tm_id: '{tm id}'
                      pe_id: '{pe id}'
              Scheduled Bulk Campaign:
                value:
                  file_code: '{file code from upload}'
                  campaign_name: '{campaign name}'
                  personalised: false
                  schedule_datetime: '2025-06-01 10:00:00'
                  timezone: Asia/Kolkata
                  payload:
                    message_type: text
                    method: promotion
                    text: '{message text}'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the bulk message submission.
                  message:
                    type: string
                    description: The response message.
              examples:
                Campaign accepted:
                  value:
                    status: success
                    message: campaign with id ce078410-e593-11ed-9242-0242ac11xxxx is now processing
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: array
                    items:
                      type: string
                    description: List of validation errors.
              examples:
                Invalid file code:
                  value:
                    error:
                      - file_code - Invalid or expired file code.
                Campaign name too short:
                  value:
                    error:
                      - campaign_name - Shorter than minimum length 3.
                Invalid message type:
                  value:
                    status: failed
                    message: Api execution not successful
                    details: Please provide message type
        '401':
          description: Authentication Failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Unauthorized access.
              examples:
                Unauthorized:
                  value:
                    response: Unauthorized
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The error status.
                  message:
                    type: string
                    description: Rate limit exceeded message.
                  retry_after:
                    type: integer
                    description: Number of seconds to wait before retrying.
              examples:
                Rate limit exceeded:
                  value:
                    status: error
                    message: Too many requests. Please retry after the indicated time.
                    retry_after: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the bulk send operation.
                  message:
                    type: string
                    description: The response message.
              examples:
                Server error:
                  value:
                    status: error
                    message: Unknown error occured while processing request
      security:
        - jwt: []
