          example: '2025-01-23 00:00:00'
        - name: end_date
          in: query
          required: true
          schema:
            type: string
          description: End date and time for the report range (YYYY-MM-DD HH:MM:SS).
          example: '2026-01-23 00:00:00'
        - name: page_number
