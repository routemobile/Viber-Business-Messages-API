            "https://" and ending with the file extension such as ".mp4".
        text:
          type: string
          description: The body text to display with the video.
        thumbnail_url:
          type: string
          description: The thumbnail image URL for the video preview.
        button_text:
          type: string
          description: The text label for the action button.
    vbs_single_video_text_action_button_msg:
