    vbs_single_otp_msg:
      type: object
      title: OTP Verification Message
      description: >-
        Send a one-time password or verification code to a recipient using a
        pre-approved Viber OTP template. Template parameters are passed as
        key-value pairs inside `template_params`.
      properties:
        phone:
          type: string
          description: The recipient's phone number in international format, including the country code.
        message_type:
          type: string
          description: The type of the message. Must be set to "verify_otp".
        method:
          type: string
          description: The method of sending. Must be set to "verify".
        template:
          type: object
          description: The OTP template configuration.
          properties:
            template_id:
              type: string
              description: The UUID of the approved OTP template.
            template_params:
              type: object
              description: Key-value pairs of template parameter substitutions.
              additionalProperties:
                type: string
            template_lang:
              type: string
              description: The language code for the template (e.g. "en").
    vbs_single_text_template_msg:
      type: object
      title: Single Text Template
      description: >-
        Send a branded text message to a recipient using an approved Viber text
        template.
      properties:
        phone:
          type: string
          description: The recipient's phone number in international format, including the country code.
        message_type:
          type: string
          description: The type of the message. Must be set to "text_template".
        method:
          type: string
          description: The method of sending the message (e.g. "transaction").
        text:
          type: string
          description: The message text, matching the approved template syntax.
        tracking_data:
          type: string
          description: Optional tracking identifier for the message.
    vbs_single_fallback_msg:
      type: object
      title: Single Message with Fallback
      description: >-
        Send a Viber message with an automatic fallback channel in case the
        recipient is unreachable on Viber. Fallback can be to WhatsApp
        (`fallback_channel: whatsapp`) or SMS (`fallback_channel: sms`).
        Include the corresponding `fallback_whatsapp` or `fallback_sms` block.
      properties:
        phone:
          type: string
          description: The recipient's phone number in international format, including the country code.
        message_type:
          type: string
          description: The Viber message type (e.g. "text").
        method:
          type: string
          description: The method of sending the message.
        text:
          type: string
          description: The Viber message text.
        tracking_data:
          type: string
          description: Optional tracking identifier for the message.
        fallback_channel:
          type: string
          description: The fallback channel to use if Viber delivery fails. Must be "whatsapp" or "sms".
          enum:
            - whatsapp
            - sms
        fallback_whatsapp:
          type: object
          description: WhatsApp fallback configuration. Required when fallback_channel is "whatsapp".
          properties:
            fallback_sender:
              type: string
              description: The WhatsApp sender ID.
            fallback_username:
              type: string
              description: The WhatsApp account username.
            fallback_text:
              type: string
              description: The fallback message text.
            template_id:
              type: string
              description: The WhatsApp template ID.
            tm_id:
              type: string
              description: The TM ID for DLT compliance.
            pe_id:
              type: string
              description: The PE ID for DLT compliance.
        fallback_sms:
          type: object
          description: SMS fallback configuration. Required when fallback_channel is "sms".
          properties:
            fallback_sender:
              type: string
              description: The SMS sender ID.
            fallback_username:
              type: string
              description: The SMS account username.
            fallback_text:
              type: string
              description: The fallback SMS text.
            template_id:
              type: string
              description: The SMS template ID.
            tm_id:
              type: string
              description: The TM ID for DLT compliance.
            pe_id:
              type: string
              description: The PE ID for DLT compliance.
